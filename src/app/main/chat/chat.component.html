<div class="flex flex-col h-screen max-w-4xl mx-auto bg-gray-900 border-x border-gray-700 shadow-xl">
    
    <!-- Header -->
    <div class="flex items-center gap-4 p-4 border-b border-gray-700 bg-gray-800 shrink-0">
        <i class="pi pi-arrow-left text-xl cursor-pointer hover:text-gray-300" onclick="history.back()"></i>
        <div class="flex flex-col">
            <span class="text-lg font-semibold text-white">{{ otherUserName }}</span>
        </div>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="bg-red-500/20 border border-red-500 text-red-100 p-4 m-4 rounded">
        {{ errorMessage }}
    </div>

    <!-- Message Area -->
    <div #messageContainer class="flex-1 overflow-y-auto p-4 flex flex-col gap-4" *ngIf="!errorMessage">
        <app-message *ngFor="let msg of messages" [message]="msg"></app-message>
    </div>

    <!-- Input Area -->
    <div class="flex flex-col border-t border-gray-700 bg-gray-800 shrink-0">
        <!-- Selected Files Preview -->
        <div *ngIf="selectedFiles.length > 0" class="flex gap-2 p-3 pb-0 overflow-x-auto">
            <div *ngFor="let file of selectedFiles; let i = index" class="relative group bg-gray-700 rounded p-2 flex items-center gap-2 max-w-[200px]">
                <i class="pi pi-file text-gray-400"></i>
                <span class="text-xs text-white truncate flex-1">{{ file.name }}</span>
                <button (click)="removeFile(i)" class="text-red-400 hover:text-red-300 ml-1">
                    <i class="pi pi-times text-xs"></i>
                </button>
            </div>
        </div>

        <div class="p-4 flex gap-2 items-center">
            <input type="file" #fileInput class="hidden" multiple accept="image/*,video/*" (change)="onFileSelected($event)">
            
            <button pButton icon="pi pi-image" (click)="triggerFileInput()" class="p-button-rounded p-button-text text-gray-400 hover:text-white" title="Attach media (image/video)"></button>
            
            <input pInputText type="text" [(ngModel)]="newMessage" (keyup.enter)="sendMessage()" 
                   placeholder="Type a message..." 
                   class="flex-1 bg-gray-700 border-none text-white focus:ring-1 focus:ring-green-500 rounded-full px-4 py-2" />
                   
            <button pButton icon="pi pi-send" (click)="sendMessage()" [disabled]="!newMessage.trim() && selectedFiles.length === 0"
                    class="p-button-rounded p-button-primary bg-green-600 hover:bg-green-500 border-none"></button>
        </div>
    </div>
</div>
